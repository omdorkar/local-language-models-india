[project]
name = "local-language-models-india"
version = "0.1.0"
description = "Language and Script Gaps in Local Language Models for Indian Users: an offline audit of whether local LLMs give Indian users equal answers across languages, scripts and writing styles."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "huggingface_hub>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "tabulate>=0.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Per-model tokenizers for the "token tax" analysis.
tokens = ["transformers>=4.45", "sentencepiece>=0.2", "tiktoken>=0.7", "protobuf>=5"]
# Figures and the local dashboard.
analysis = ["matplotlib>=3.9", "streamlit>=1.38", "lxml>=5"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
